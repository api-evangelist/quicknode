openapi: 3.2.0
info:
  title: QuickNode Streams REST Logs API
  description: The QuickNode Streams REST API allows developers to create, manage, and monitor Streams, QuickNode's customizable real-time blockchain data feed service. Streams can be configured to deliver filtered event-driven data over destinations such as webhooks or storage targets. The REST API supports listing, creating, pausing, resuming, and inspecting streams, as well as retrieving execution logs.
  version: 1.0.0
  contact:
    name: QuickNode Support
    url: https://www.quicknode.com/support
servers:
- url: https://api.quicknode.com/streams/rest/v1
  description: QuickNode Streams REST production server
security:
- ApiKeyAuth: []
tags:
- name: Logs
  description: Inspect Stream execution logs.
paths:
  /streams/{streamId}/logs:
    get:
      tags:
      - Logs
      summary: List Stream logs
      operationId: listStreamLogs
      parameters:
      - name: streamId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
externalDocs:
  description: QuickNode Streams Documentation
  url: https://www.quicknode.com/docs/streams
